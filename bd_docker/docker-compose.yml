version: "3"
services:
    db:
        image: postgres
        container_name: "manipulando_datas"
        environment:
            - POSTGRES_USER=
            - POSTGRES_PASSWORD=
            - POSTGRES_DB=manipulando_datas
        ports:
            - "5432:5432"
        volumes:
            - ./db:/var/lib/postgresql/data/
            - ./scripts/create_table.sql:/docker-entrypoint-initdb.d/create_table.sql
